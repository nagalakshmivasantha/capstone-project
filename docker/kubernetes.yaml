apiVersion: v1
kind: ConfigMap
metadata:
  name: quality-gateway-config
data:
  MINIO_MODE: "real"
  MINIO_ENDPOINT: "http://minio:9000"
  QUALITY_JOB_WORKERS: "4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quality-gateway
  template:
    metadata:
      labels:
        app: quality-gateway
    spec:
      containers:
        - name: gateway
          image: ai-data-quality-gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: quality-gateway-config
            - secretRef:
                name: quality-gateway-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: quality-gateway
spec:
  selector:
    app: quality-gateway
  ports:
    - port: 8000
      targetPort: 8000
