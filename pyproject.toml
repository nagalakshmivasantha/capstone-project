[project]
name = "ai-data-quality-gateway"
version = "0.1.0"
description = "AI Data Quality Engine and Quality Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.1",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=17.0.0",
  "pydantic>=2.9.0",
  "boto3>=1.35.0",
  "mysql-connector-python>=9.0.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.3.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
